name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # The dedup query is Postgres behaviour: DISTINCT ON, a window function
    # that has to run before it, and an ORDER BY that picks which copy
    # survives. Testing it anywhere else would test a reimplementation.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: freightops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install pytest "psycopg[binary]"

      - run: pytest -q
        env:
          DATABASE_URL: postgresql://runner:runner@localhost:5432/freightops_test
